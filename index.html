
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PromptVault | AI Prompt Library</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0b0b0b;color:#f5f1e8;font-family:Arial,sans-serif}
header{padding:22px 7%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #29251c}
.logo{font-size:23px;font-weight:bold;color:#d9b66f}
nav a{color:#ddd;text-decoration:none;margin-left:20px;font-size:14px}
.hero{text-align:center;padding:85px 20px 55px}
.tag{color:#d9b66f;letter-spacing:3px;font-size:12px}
h1{font-size:clamp(36px,7vw,65px);margin:22px 0}
h1 span{color:#d9b66f}
.hero p{color:#aaa;line-height:1.7;max-width:600px;margin:auto}
.search{max-width:620px;margin:30px auto;display:flex}
.search input{width:100%;padding:17px;background:#171717;border:1px solid #51452e;border-radius:8px;color:white;font-size:15px}
.section{padding:35px 7%}
.section h2{font-size:27px;margin-bottom:22px}
.categories{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:28px}
.categories button,.copy{background:#171717;color:#d9b66f;border:1px solid #51452e;padding:11px 17px;border-radius:6px;cursor:pointer}
.categories button.active,.copy:hover{background:#d9b66f;color:#111}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.card{background:#151515;border:1px solid #302a20;border-radius:10px;padding:22px}
.card small{color:#d9b66f}
.card h3{margin:14px 0}
.card p{color:#aaa;line-height:1.6;font-size:14px;min-height:65px}
.copy{margin-top:18px}
.empty{color:#aaa;padding:25px 0}
footer{text-align:center;padding:35px;color:#777;border-top:1px solid #29251c;margin-top:50px}
@media(max-width:600px){nav a{margin-left:8px;font-size:12px}.hero{padding-top:65px}}
</style>
</head>
<body>
<header>
<div class="logo">PROMPTVAULT.</div>
<nav><a href="#home">Home</a><a href="#library">Library</a></nav>
</header>
<section class="hero" id="home">
<div class="tag">THE AI PROMPT COLLECTION</div>
<h1>Discover the power of <span>better prompts.</span></h1>
<p>Explore useful AI prompts, improve your workflow and turn creative ideas into powerful results.</p>
<div class="search"><input id="search" placeholder="Search prompts..." oninput="render()"></div>
</section>
<section class="section" id="library">
<h2>Explore the Library</h2>
<div class="categories" id="categories"></div>
<div class="grid" id="grid"></div>
</section>
<footer>© 2026 PromptVault. Built for creative minds.</footer>
<script>
const prompts=[
{title:"Business Idea Generator",cat:"Business",desc:"Discover practical business ideas based on your interests and skills.",prompt:"Act as a business strategist. Generate 10 practical business ideas for a beginner. For each idea explain the target audience, problem solved, revenue model and first steps."},
{title:"Content Creator Assistant",cat:"Content",desc:"Create engaging content ideas for your social media platforms.",prompt:"Act as a professional content strategist. Generate 15 original content ideas for my niche. Include hooks, target audience and suggested formats."},
{title:"Professional Email Writer",cat:"Writing",desc:"Write clear and professional emails for everyday situations.",prompt:"Act as a professional communication expert. Help me write a clear, polite and professional email about the following topic: [YOUR TOPIC]."},
{title:"Learn Any Skill",cat:"Education",desc:"Build a structured learning roadmap for a new skill.",prompt:"Act as an expert teacher. Create a beginner-friendly 30-day learning roadmap for [SKILL]. Include daily lessons, examples and practice tasks."},
{title:"Marketing Strategy",cat:"Business",desc:"Create a marketing plan for a new product or service.",prompt:"Act as a marketing strategist. Create a marketing plan for [PRODUCT]. Include audience research, positioning, content strategy and success metrics."},
{title:"Story Idea Generator",cat:"Writing",desc:"Generate creative story concepts with interesting characters.",prompt:"Generate 5 original story concepts. For each provide a title, central conflict, main character and surprising twist."}
];
let active="All";
const cats=["All",...new Set(prompts.map(p=>p.cat))];
function renderCategories(){
document.getElementById("categories").innerHTML=cats.map(c=>`<button class="${active===c?'active':''}" onclick="active='${c}';render()">${c}</button>`).join("");
}
function render(){
renderCategories();
const q=document.getElementById("search").value.toLowerCase();
const filtered=prompts.filter(p=>(active==="All"||p.cat===active)&&(p.title.toLowerCase().includes(q)||p.desc.toLowerCase().includes(q)||p.cat.toLowerCase().includes(q)));
document.getElementById("grid").innerHTML=filtered.length?filtered.map((p,i)=>`<article class="card"><small>${p.cat}</small><h3>${p.title}</h3><p>${p.desc}</p><button class="copy" onclick="copyPrompt(${prompts.indexOf(p)})">Copy Prompt ↗</button></article>`).join(""):'<p class="empty">No prompts found. Try another search.</p>';
}
function copyPrompt(i){
const value=prompts[i].prompt;
if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(value).then(()=>alert("Prompt copied!")).catch(()=>alert(value));}
else{const t=document.createElement("textarea");t.value=value;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove();alert("Prompt copied!");}
}
render();
</script>
</body>
</html>
